<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pervej Hosen | Portfolio</title>
  <meta name="description" content="Pervej Hosen — Sr. BI Developer and Analytics Engineer. Power BI, SQL, Snowflake, BigQuery, Databricks and Python for teams in the US, UAE, Germany and Australia.">
  <meta name="theme-color" content="#0b1020">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2b">
</head>
<body>

  <div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <header>
    <nav class="nav">
      <a href="#home" class="logo grad-text" id="logo"></a>
      <button class="burger" id="burger" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <ul id="menu">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ================= HERO ================= -->
    <section id="home" class="hero">
      <div class="wrap two">
        <div class="reveal">
          <p class="eyebrow">Welcome to my world</p>
          <h1>HI, I'M <span class="grad-text" id="heroName"></span></h1>
          <div class="typed-box"><span class="grad-text" id="typed"></span><span class="cursor"></span></div>
          <div class="card objective" id="objective"></div>
          <div class="socials" id="heroSocials"></div>
          <div class="btns">
            <a href="#contact" class="btn btn-primary" id="hireBtn">Hire Me</a>
            <a href="#" class="btn btn-ghost" id="resumeBtn" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a3 3 0 1 1 4.2 4.2l-2 2a1 1 0 1 1-1.4-1.4l2-2a1 1 0 0 0-1.4-1.4L12 13.4a1 1 0 0 1-1.4 0zm2.8-2.8a1 1 0 0 1 0 1.4l-3.5 3.5a3 3 0 1 1-4.2-4.2l2-2a1 1 0 0 1 1.4 1.4l-2 2a1 1 0 0 0 1.4 1.4L12 10.6a1 1 0 0 1 1.4 0z"/></svg>
              My Resume
            </a>
          </div>
        </div>
        <div class="photo-wrap reveal">
          <div class="photo-card"><div class="photo-blob" id="photo"></div></div>
        </div>
      </div>
    </section>

    <!-- ================= ABOUT ================= -->
    <section id="about">
      <div class="wrap two" style="align-items:start">
        <div class="reveal">
          <h2 class="sec-title">About Me</h2>
          <p class="sec-sub accent">Who I Am?</p>
          <div class="card illus">
            <svg viewBox="0 0 400 400" aria-hidden="true">
              <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
              <path d="M70 210c-10-80 50-140 130-140s150 40 140 120-40 140-140 140S80 290 70 210z" fill="#f59e0b"/>
              <rect x="95" y="120" width="210" height="140" rx="12" fill="#0f172a" stroke="#fff" stroke-width="4"/>
              <rect x="112" y="138" width="54" height="26" rx="5" fill="#1e293b"/><rect x="173" y="138" width="54" height="26" rx="5" fill="#1e293b"/><rect x="234" y="138" width="54" height="26" rx="5" fill="#1e293b"/>
              <rect x="118" y="146" width="30" height="9" rx="2" fill="#f97316"/><rect x="179" y="146" width="24" height="9" rx="2" fill="#ec4899"/><rect x="240" y="146" width="34" height="9" rx="2" fill="#38bdf8"/>
              <polyline points="114,238 140,220 164,228 190,198 214,208 240,182 286,176" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <g fill="#334155"><rect x="118" y="244" width="10" height="8"/><rect x="134" y="240" width="10" height="12"/><rect x="150" y="236" width="10" height="16"/></g>
              <rect x="180" y="260" width="40" height="30" fill="#e2e8f0"/><rect x="140" y="288" width="120" height="10" rx="5" fill="#e2e8f0"/>
              <circle cx="320" cy="110" r="28" fill="#fff"/><path d="M320 110V82a28 28 0 0 1 26 18z" fill="url(#g1)"/>
              <g fill="#fff"><rect x="62" y="290" width="14" height="40" rx="3"/><rect x="82" y="270" width="14" height="60" rx="3"/><rect x="102" y="300" width="14" height="30" rx="3"/></g>
            </svg>
          </div>
        </div>
        <div class="reveal">
          <div class="card about-text" id="aboutText"></div>
          <div class="facts" id="facts"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/config.js?v=2b"></script>
  <script src="js/main.js?v=2b"></script>
</body>
</html>
