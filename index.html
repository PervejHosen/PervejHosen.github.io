<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pervej Hosen | Portfolio</title>
  <meta name="description" content="Pervej Hosen — Sr. BI Developer and Analytics Engineer. Power BI, SQL, Snowflake, BigQuery, Databricks and Python for teams in the US, UAE, Germany and Australia.">
  <meta name="theme-color" content="#020817">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3t">
</head>
<body>

  <header>
    <nav class="nav">
      <a href="#home" class="logo" id="logo"></a>
      <ul id="menu">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
      </ul>
      <a href="#contact" class="btn btn-primary btn-sm nav-cta" id="navCta">Let's talk</a>
      <button class="burger" id="burger" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <!-- ================= HERO ================= -->
    <section id="home" class="hero">
      <div class="hero-grid" aria-hidden="true"></div>
      <svg class="hero-lines" viewBox="0 0 1200 600" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
        <polyline points="0,470 120,430 240,450 360,380 480,400 600,320 720,350 840,260 960,280 1080,190 1200,210" fill="none" stroke="url(#hl)" stroke-width="2"/>
        <polyline points="0,520 140,500 280,510 420,460 560,480 700,420 840,440 980,370 1120,380 1200,340" fill="none" stroke="url(#hl)" stroke-width="1.2" opacity=".6"/>
      </svg>
      <div class="wrap two">
        <div class="reveal">
          <p class="kicker">Business Intelligence · Analytics Engineering</p>
          <h1>Hi, I'm <span class="hl" id="heroName"></span></h1>
          <div class="typed-line"><span id="typed"></span><span class="cursor"></span></div>
          <p class="objective" id="objective"></p>
          <div class="btns">
            <a href="#contact" class="btn btn-primary" id="hireBtn">Hire me</a>
            <a href="#" class="btn btn-light" id="resumeBtn" target="_blank" rel="noopener">My résumé</a>
          </div>
          <div class="socials" id="heroSocials"></div>
        </div>
        <div class="photo-wrap reveal">
          <div class="photo-ring"><div class="photo" id="photo"></div></div>
          <div class="badge"><b>PL-300</b><span>Microsoft certified</span></div>
        </div>
      </div>
    </section>

    <!-- ================= STATS BAND ================= -->
    <div class="band">
      <div class="wrap facts" id="facts"></div>
    </div>

    <!-- ================= ABOUT ================= -->
    <section id="about" class="light">
      <div class="wrap">
        <div class="center-head reveal">
          <p class="kicker">Who I am</p>
          <h2 class="sec-title">Data that people <span class="hl">act on</span>.</h2>
        </div>
        <div class="two about-grid">
          <div class="career-chart reveal" id="careerChart">
            <h3 class="cc-title">Experience</h3>
            <ol class="cc-rows" id="ccRows"></ol>
          </div>
          <div class="about-text reveal" id="aboutText"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/config.js?v=3t"></script>
  <script src="js/main.js?v=3t"></script>
</body>
</html>
